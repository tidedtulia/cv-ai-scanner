# Test → build → deploy to Azure when a PR is merged into main (docs/features/auto-deploy).
#  - pull request: tests only (no image push, no Azure access, also for forks)
#  - push to main (= a merge), unless only docs changed: test → build 3 images → scan → push to ghcr.io → deploy
#  - run by hand with a `tag`: deploy an image that already exists (roll back); without a tag: like a push to main
# A newer run CANCELS the test / build of an older one; the deploy of an older run is NEVER interrupted (it could stop a
# migration or the update of n8n half way): a newer deploy waits, and only the newest waiting one is kept.
# One-time setup: scripts/deploy/setup-github-oidc.sh (prints the three AZURE_* repository variables).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing image tag to deploy (roll back). Empty = test, build and deploy this commit'
        required: false
        default: ''

permissions:
  contents: read

env:
  NX_NO_CLOUD: 'true'
  # the name prefix of the Container Apps (namePrefix in the Bicep parameters)
  NAME_PREFIX: ${{ vars.NAME_PREFIX || 'cvs' }}

jobs:
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Prisma client
        run: npx prisma generate --schema packages/backend/prisma/schema.prisma

      - name: Tests (shared, backend, frontend)
        run: npx nx run-many -t test --all

      - name: Tests (n8n scoring and credentials)
        run: npm run wf1:test

      - name: Deployment workflow and scripts
        run: npm run workflow:check

      - name: Build (type-check)
        run: npx nx run-many -t build --all

      # Report only: ~43 old enforce-module-boundaries errors still exist. Make it blocking when they are fixed.
      - name: Lint (report only)
        continue-on-error: true
        run: npx nx run-many -t lint --all

  build:
    needs: test
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      # no build-record artifacts / summaries (3 per run, kept 90 days, nobody reads them)
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      DOCKER_BUILD_SUMMARY: 'false'
    steps:
      - uses: actions/checkout@v4

      - name: Work out the tag and the registry path
        id: meta
        run: |
          tag="$(date -u +%Y%m%d).${{ github.run_number }}"
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build backend (kept local until it is scanned)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          load: true
          push: false
          tags: local/cv-backend:build

      - name: Build frontend (BACKEND_URL is baked in at build time)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/frontend/Dockerfile
          build-args: BACKEND_URL=http://${{ env.NAME_PREFIX }}-backend
          load: true
          push: false
          tags: local/cv-frontend:build

      - name: Build n8n
        uses: docker/build-push-action@v6
        with:
          context: .
          file: n8n/Dockerfile
          load: true
          push: false
          tags: local/cv-n8n:build

      - name: Scan the 3 images (nothing is pushed if one is not clean)
        run: sh scripts/deploy/scan-image.sh local/cv-backend:build local/cv-frontend:build local/cv-n8n:build

      - name: Log in to ghcr.io with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push (after the scan, all three together)
        run: |
          for name in cv-backend cv-frontend cv-n8n; do
            for tag in "${{ steps.meta.outputs.tag }}" "sha-$(echo "${{ github.sha }}" | cut -c1-7)"; do
              docker tag "local/$name:build" "${{ steps.meta.outputs.registry }}/$name:$tag"
              docker push "${{ steps.meta.outputs.registry }}/$name:$tag"
            done
          done

  deploy:
    needs: build
    # `build` is skipped when a tag is given by hand, so the condition names both cases
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production
    permissions:
      contents: read
      id-token: write
    # Never cancel a running deploy; a newer one waits and only the newest waiting one is kept
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Sign in to Azure (OIDC, no stored secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        env:
          TAG: ${{ inputs.tag != '' && inputs.tag || needs.build.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'cvs-rg' }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          bash scripts/deploy/deploy.sh "$TAG"
