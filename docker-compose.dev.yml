services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- n8n (profile "n8n": only `npm run n8n:up` starts it; `npm run db:up` stays Postgres-only) ----
  # Feature docs: docs/features/n8n-docker-setup/requirements.md

  # One-shot, every `up`: database n8n + roles n8n / n8n_app / mcp_readonly + grants (idempotent)
  n8n-init:
    image: postgres:17-alpine
    profiles: ["n8n"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-}
      N8N_APP_DB_PASSWORD: ${N8N_APP_DB_PASSWORD:-}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-}
    volumes:
      - ./n8n/setup:/setup:ro
    entrypoint: ["sh", "/setup/init-db.sh"]

  n8n:
    image: n8nio/n8n:2.46.6
    profiles: ["n8n"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      n8n-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      # n8n's own data → database n8n (role n8n)
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-}
      # Fixed key: credentials stay readable across containers / machines
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      N8N_WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Read by /setup/entrypoint.sh (owner + credentials), removed before n8n starts
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-}
      N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-}
      N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-}
      POSTGRES_DB: ${POSTGRES_DB}
      N8N_APP_DB_PASSWORD: ${N8N_APP_DB_PASSWORD:-}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/setup:/setup:ro
      - ./n8n/workflows:/workflows
    entrypoint: ["tini", "--", "sh", "/setup/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5678/healthz/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s

volumes:
  postgres_data:
  n8n_data:
